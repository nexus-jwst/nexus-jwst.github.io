<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS multi-survey footprint schematic</title>
  <desc id="desc">Two-scale diagram showing the SPHEREx North Deep Field around the North Ecliptic Pole and a zoomed view of EUDF, RXDF, and the NEXUS Wide and Deep tiers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#718096"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
      .panel-title { font-size: 26px; font-weight: 700; fill: #172b4d; }
      .label { font-size: 21px; font-weight: 700; }
      .detail { font-size: 17px; fill: #42526e; }
      .small { font-size: 15px; fill: #5e6c85; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <rect x="30" y="30" width="420" height="610" rx="6" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="520" y="30" width="650" height="610" rx="6" fill="#f7f9fc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="60" y="76" class="panel-title">North Ecliptic Pole context</text>
  <text x="550" y="76" class="panel-title">EUDF detail</text>

  <ellipse cx="240" cy="340" rx="170" ry="230" fill="#dce8f5" stroke="#4f6f96" stroke-width="3"/>
  <path d="M110 210 C180 130 320 120 385 220 M92 344 C170 300 325 300 410 360 M130 500 C220 560 340 520 390 450" fill="none" stroke="#9bb3ce" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="240" y="280" text-anchor="middle" class="label" fill="#294f7a">SPHEREx</text>
  <text x="240" y="308" text-anchor="middle" class="detail">North Deep Field</text>
  <text x="240" y="334" text-anchor="middle" class="detail">~100 deg²</text>

  <circle cx="250" cy="380" r="12" fill="#22a699" stroke="#ffffff" stroke-width="4"/>
  <circle cx="250" cy="380" r="25" fill="none" stroke="#22a699" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M236 380 H264 M250 366 V394" stroke="#172b4d" stroke-width="2"/>
  <text x="250" y="425" text-anchor="middle" class="label" fill="#147d73">Deep-field region</text>
  <text x="250" y="451" text-anchor="middle" class="small">detail enlarged at right</text>

  <path d="M278 368 C370 300 435 260 505 230" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M278 393 C385 470 445 490 505 500" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="845" cy="350" r="285" fill="#d9f1ed" fill-opacity="0.40" stroke="#22a699" stroke-width="4"/>
  <text x="1160" y="96" text-anchor="end" class="label" fill="#147d73">EUDF</text>
  <text x="1160" y="122" text-anchor="end" class="detail">radius ~0.5°</text>
  <path d="M1100 134 L1058 174" stroke="#147d73" stroke-width="2"/>

  <g id="rxdf" transform="rotate(-8 845 350)">
    <rect x="610" y="225" width="470" height="255" rx="4" fill="#f7c873" fill-opacity="0.22" stroke="#c98200" stroke-width="4"/>
  </g>

  <g id="nexus-wide" transform="translate(845 350) rotate(-8) scale(0.88)">
    <g fill="none" stroke="#d62728" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
      <rect x="-100" y="-100" width="200" height="200" transform="rotate(-42)"/>
      <rect x="-98" y="-98" width="196" height="196" transform="rotate(0)"/>
      <rect x="-94" y="-94" width="188" height="188" transform="rotate(42)"/>
    </g>
  </g>

  <g id="nexus-deep" transform="translate(845 350) rotate(-8)">
    <polygon points="0,-45 39,-23 39,23 0,45 -39,23 -39,-23" fill="#7b2cbf" fill-opacity="0.70" stroke="#5a189a" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <path d="M828 228 L790 178" stroke="#c98200" stroke-width="2"/>
  <text x="710" y="126" class="label" fill="#a56700">RXDF</text>
  <text x="710" y="152" class="detail">50.3' × 25.5'</text>
  <text x="710" y="176" class="small">&gt;1,200 arcmin² total</text>

  <path d="M780 440 L710 526" stroke="#d62728" stroke-width="2"/>
  <text x="680" y="552" class="label" fill="#d62728">NEXUS Wide</text>
  <text x="680" y="578" class="detail">~400 arcmin²</text>

  <path d="M882 376 L943 505" stroke="#5a189a" stroke-width="2"/>
  <text x="920" y="531" class="label" fill="#5a189a">NEXUS Deep</text>
  <text x="920" y="557" class="detail">~50 arcmin²</text>

  <g id="nexus-center-marker" transform="translate(845 350)">
    <circle r="7" fill="#172b4d"/>
    <path d="M-16 0 H16 M0 -16 V16" stroke="#172b4d" stroke-width="3"/>
  </g>
  <text x="845" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">NEXUS center</text>
  <text x="30" y="686" class="small">Note: this is a simplified layout schematic; the scale is not necessarily identical to the actual footprint. The NEXUS parallel-observation footprint is not shown.</text>
</svg>
